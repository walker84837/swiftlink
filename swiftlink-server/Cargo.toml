[package]
name = "swiftlink-server"
version = "0.0.2"
edition = "2024"

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls"] }
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.29"
rand = "0.10.0-rc.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "postgres", "sqlite", "tls-rustls"] }
thiserror = "2.0.18"
toml = "0.9.11"
url = "2.5.8"
governor = "0.10.4"
swiftlink-api = { path = "../swiftlink-api", features = ["async"] }
futures-util = "0.3.31"
