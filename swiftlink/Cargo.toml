[package]
name = "swiftlink"
version = "0.0.3"
edition = "2024"
description = "Swiftlink URL shortener server - fast, flexible link shortening with a simple API"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/walker84837/swiftlink"
readme = "../README.md"
categories = ["web-programming", "database", "authentication"]
keywords = ["url-shortener", "link-shortening", "actix-web", "rest-api"]

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls"] }
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.29"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlite", "tls-rustls"] }
thiserror = "2.0.18"
toml = "0.9.11"
url = "2.5.8"
governor = "0.10.4"
swiftlink-api = { path = "../swiftlink-api", features = ["async"] }
futures-util = "0.3.31"
subtle = "2.6.1"
